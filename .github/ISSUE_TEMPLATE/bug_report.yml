name: Bug report
description: Something in the OTP pipeline does not work as expected
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Never paste a real OTP code** — replace it with `XXXXXX`.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what did the app do instead?
    validations:
      required: true
  - type: textarea
    id: sms
    attributes:
      label: SMS template (redacted)
      description: The message as received, with the code replaced by XXXXXX. Keep Persian/Arabic digits as they arrived.
      render: text
    validations:
      required: false
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: e.g. Pixel 7, Android 14 / Xiaomi 13T, HyperOS 1.0
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Ramzyar version
      placeholder: e.g. v3 (from the release title)
    validations:
      required: true
  - type: checkboxes
    id: settings
    attributes:
      label: Enabled settings
      options:
        - label: Custom keywords are configured
        - label: Sender whitelist is enabled
        - label: Notification dismissal is enabled
        - label: Automatic copy is enabled
