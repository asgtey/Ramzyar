name: Release APK (arm64-v8a)

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${RELEASE_KEYSTORE_BASE64:-}" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > app/release.keystore
            {
              echo "RELEASE_STORE_FILE=release.keystore"
              echo "RELEASE_STORE_PASSWORD=${RELEASE_STORE_PASSWORD}"
              echo "RELEASE_KEY_ALIAS=${RELEASE_KEY_ALIAS}"
              echo "RELEASE_KEY_PASSWORD=${RELEASE_KEY_PASSWORD}"
            } > keystore.properties
          else
            keytool -genkeypair -batch \
              -keystore app/release.keystore \
              -alias ci \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Ramzyar CI, O=Ramzyar, C=IR"
            {
              echo "RELEASE_STORE_FILE=release.keystore"
              echo "RELEASE_STORE_PASSWORD=android"
              echo "RELEASE_KEY_ALIAS=ci"
              echo "RELEASE_KEY_PASSWORD=android"
            } > keystore.properties
          fi

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build release APK (arm64-v8a)
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare APK
        id: apk
        run: |
          set -euo pipefail
          SRC="$(find app/build/outputs/apk/release -name '*arm64-v8a*.apk' | head -n 1)"
          if [ -z "$SRC" ]; then
            SRC="$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          fi
          NAME="Ramzyar-arm64-v8a-v${{ github.run_number }}.apk"
          cp "$SRC" "$NAME"
          echo "file=$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ramzyar-arm64-v8a
          path: ${{ steps.apk.outputs.file }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ github.run_number }}"
          gh release create "$TAG" \
            "${{ steps.apk.outputs.file }}" \
            --title "Ramzyar ${TAG} (arm64-v8a)" \
            --generate-notes \
            --latest
